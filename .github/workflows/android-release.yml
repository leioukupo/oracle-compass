name: Android Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Build and publish a GitHub Release"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Release tag; blank uses v<versionName>"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_COMPILE_SDK: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_NDK_VERSION: "27.0.12077973"
      ANDROID_CMAKE_VERSION: "3.22.1"
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          test -n "${app_version}"

          publish=false
          tag=""
          if [[ "${REF_TYPE}" == "tag" ]]; then
            publish=true
            tag="${REF_NAME}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && "${INPUT_PUBLISH}" == "true" ]]; then
            publish=true
            tag="${INPUT_TAG:-v${app_version}}"
          fi

          if [[ "${publish}" == "true" ]]; then
            [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
              echo "Invalid release tag: ${tag}" >&2
              exit 2
            }
            if [[ "${tag}" != "v${app_version}" && "${tag}" != "v${app_version}-"* ]]; then
              echo "Release tag ${tag} does not match app version ${app_version}" >&2
              exit 3
            fi
          fi

          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Resolved app_version=${app_version}, publish=${publish}, tag=${tag:-none}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build boot animation module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bootanimation-tool release
          app_version="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          test -n "${app_version}"
          javac -d build/bootanimation-tool tools/BootAnimationGenerator.java
          java -Djava.awt.headless=true -cp build/bootanimation-tool \
            BootAnimationGenerator release "${app_version}"
          module="$(find release -maxdepth 1 -type f -name 'oracle-compass-bootanimation-v*.zip' -print -quit)"
          test -s "${module}"
          cp "${module}" app/src/main/assets/oracle-compass-bootanimation.zip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Prepare eSpeak NG headers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party
          git clone --depth 1 https://github.com/espeak-ng/espeak-ng.git third_party/espeak-ng

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Collect and sign APK
        id: sign_apk
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ steps.release_meta.outputs.publish }}
          APP_VERSION: ${{ steps.release_meta.outputs.app_version }}
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name "*.apk" | sort)
          if (( ${#apks[@]} == 0 )); then
            echo "No release APK found under app/build/outputs/apk/release"
            exit 1
          fi

          unsigned_apk="${apks[0]}"
          cp "${unsigned_apk}" release/app-release-unsigned.apk

          signed_apk=""
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" ]]; then
            keystore="${RUNNER_TEMP}/release.keystore"
            aligned_apk="${RUNNER_TEMP}/app-release-aligned.apk"
            printf "%s" "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"

            "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign" -p -f 4 "${unsigned_apk}" "${aligned_apk}"
            "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" sign \
              --ks "${keystore}" \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --ks-key-alias "${ANDROID_KEY_ALIAS}" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --out "release/oracle-compass-v${APP_VERSION}.apk" \
              "${aligned_apk}"
            signed_apk="release/oracle-compass-v${APP_VERSION}.apk"
          else
            if [[ "${PUBLISH_RELEASE}" == "true" ]]; then
              echo "Production Android signing secrets are required to publish a Release." >&2
              exit 2
            fi
            echo "Release signing secrets are incomplete; generating a temporary CI signing key."
            keystore="${RUNNER_TEMP}/ci-release.keystore"
            aligned_apk="${RUNNER_TEMP}/app-release-ci-aligned.apk"
            keytool -genkeypair -v \
              -keystore "${keystore}" \
              -storetype PKCS12 \
              -storepass android \
              -keypass android \
              -alias oracle-compass-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Oracle Compass CI,O=Oracle Compass,C=US" \
              -noprompt

            "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign" -p -f 4 "${unsigned_apk}" "${aligned_apk}"
            "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" sign \
              --ks "${keystore}" \
              --ks-pass "pass:android" \
              --ks-key-alias oracle-compass-ci \
              --key-pass "pass:android" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --out "release/oracle-compass-v${APP_VERSION}-ci.apk" \
              "${aligned_apk}"
            signed_apk="release/oracle-compass-v${APP_VERSION}-ci.apk"
          fi

          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "${signed_apk}"
          echo "signed_apk=${signed_apk}" >> "${GITHUB_OUTPUT}"
          (
            cd release
            sha256sum \
              "$(basename "${signed_apk}")" \
              oracle-compass-bootanimation-v*.zip \
              oracle-compass-bootanimation-preview.jpg \
              oracle-compass-first-frame.jpg \
              > SHA256SUMS.txt
          )
          ls -lh release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-compass-release
          path: release/*
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.release_meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Oracle Compass ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.sign_apk.outputs.signed_apk }}
            release/oracle-compass-bootanimation-v*.zip
            release/oracle-compass-bootanimation-preview.jpg
            release/oracle-compass-first-frame.jpg
            release/SHA256SUMS.txt
